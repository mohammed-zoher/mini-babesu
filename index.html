<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek-a-Week 🍼</title>
<style>
  :root {
    --cream: #FDF6EE;
    --card-bg: #FFFCF8;
    --warm-brown: #5C3D2E;
    --muted: #8C7060;
    --accent: #C4704A;
    --accent-light: #F0D9CC;
    --accent-pale: #FAF0EA;
    --border: #EAD9CC;
    --shadow: rgba(92,61,46,0.08);
    --green: #5A7A5A;
    --green-pale: #EBF2EB;
    --blue: #4A6A8A;
    --blue-pale: #E8F0F7;
    --gold: #A07A3A;
    --gold-pale: #F5EDD8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--warm-brown);
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ── HEADER ─────────────────────────────── */
  .header {
    background: var(--warm-brown);
    background-image: radial-gradient(ellipse at 70% 50%, rgba(196,112,74,0.3) 0%, transparent 70%);
    padding: 44px 24px 36px;
    text-align: center;
    color: var(--cream);
  }
  .header-top-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-light);
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: clamp(24px, 5vw, 38px);
    font-weight: normal;
    color: #FDF6EE;
    margin-bottom: 7px;
  }
  .header .header-sub {
    font-style: italic;
    font-size: 14px;
    color: rgba(253,246,238,0.62);
  }

  /* ── BACK BAR (week view only) ───────────── */
  .back-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
    color: var(--accent);
    user-select: none;
  }
  .back-bar:hover { background: var(--accent-pale); }
  .back-bar.visible { display: flex; }
  .back-arrow { font-size: 15px; }

  /* ── INDEX VIEW ──────────────────────────── */
  #view-index { display: block; }
  #view-week  { display: none; }

  .index-main {
    max-width: 620px;
    margin: 0 auto;
    padding: 32px 18px 60px;
  }
  .section-heading {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .week-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 12px;
    margin-bottom: 36px;
  }
  .week-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 2px 14px var(--shadow);
    padding: 18px 20px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  .week-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--accent);
    border-radius: 4px 0 0 4px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .week-card:active, .week-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 22px rgba(92,61,46,0.13);
    border-color: var(--accent-light);
  }
  .week-card:active::before, .week-card:hover::before { opacity: 1; }
  .wc-num {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 4px;
  }
  .wc-title { font-size: 15px; font-weight: bold; margin-bottom: 3px; line-height: 1.3; }
  .wc-sub   { font-style: italic; font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
  .wc-topics { display: flex; flex-wrap: wrap; gap: 4px; }
  .topic-chip {
    background: var(--accent-pale); border: 1px solid var(--accent-light);
    border-radius: 12px; padding: 2px 8px; font-size: 10.5px;
  }
  .wc-arrow {
    position: absolute; top: 18px; right: 16px;
    color: var(--accent-light); font-size: 15px;
    transition: transform 0.2s, color 0.2s;
  }
  .week-card:hover .wc-arrow, .week-card:active .wc-arrow {
    transform: translateX(3px); color: var(--accent);
  }
  .week-card.soon {
    background: var(--cream); border: 1px dashed var(--border);
    box-shadow: none; opacity: 0.5; cursor: default; pointer-events: none;
  }
  .week-card.soon::before { display: none; }
  .week-card.soon .wc-num, .week-card.soon .wc-title { color: var(--muted); }
  .soon-badge {
    display: inline-block; background: var(--border); color: var(--muted);
    border-radius: 10px; padding: 2px 7px; font-size: 10px;
    letter-spacing: 0.07em; text-transform: uppercase; margin-top: 7px;
  }
  .index-divider { height: 1px; background: var(--border); margin: 28px 0; }
  .disclaimer-box {
    background: var(--blue-pale); border: 1px solid #C0D0DF;
    border-radius: 10px; padding: 14px 18px;
    font-size: 12.5px; line-height: 1.65; color: #1E3045;
    margin-top: 32px;
  }
  .disclaimer-box strong {
    display: block; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--blue); margin-bottom: 5px;
  }
  .index-footer {
    text-align: center; font-style: italic; font-size: 11px;
    color: var(--muted); padding-top: 12px;
  }

  /* ── SEARCH ─────────────────────────────── */
  .search-bar-wrapper {
    padding: 22px 18px 0;
    max-width: 620px;
    margin: 0 auto;
  }
  .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute; left: 14px;
    font-size: 14px; color: var(--muted); pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 11px 38px 11px 42px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 14px;
    color: var(--warm-brown);
    box-shadow: 0 2px 8px var(--shadow);
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }
  .search-input::placeholder { color: var(--muted); font-style: italic; }
  .search-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 2px 16px rgba(196,112,74,0.15);
  }
  .search-clear {
    position: absolute; right: 12px;
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 18px; padding: 2px 4px;
    display: none; line-height: 1; border-radius: 4px;
  }
  .search-clear.visible { display: block; }
  .search-clear:hover { color: var(--accent); background: var(--accent-pale); }

  .search-results {
    display: none;
    max-width: 620px;
    margin: 0 auto;
    padding: 14px 18px 0;
  }
  .search-results.visible { display: block; }
  .search-results-label {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .search-result-item {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 15px; margin-bottom: 8px;
    cursor: pointer; transition: all 0.18s ease;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .search-result-item:hover, .search-result-item:active {
    border-color: var(--accent-light);
    box-shadow: 0 3px 16px var(--shadow);
    transform: translateY(-1px);
  }
  .search-result-icon {
    font-size: 17px; background: var(--accent-pale);
    border: 1px solid var(--accent-light); border-radius: 8px;
    width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
  }
  .search-result-body { flex: 1; min-width: 0; }
  .search-result-week {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 2px;
  }
  .search-result-title {
    font-size: 14px; font-weight: bold; color: var(--warm-brown); margin-bottom: 3px;
  }
  .search-result-excerpt {
    font-size: 12.5px; color: var(--muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .search-result-excerpt mark {
    background: rgba(196,112,74,0.18); color: var(--warm-brown);
    border-radius: 2px; padding: 0 1px; font-style: normal;
  }
  .search-no-results {
    text-align: center; padding: 32px 20px;
    color: var(--muted); font-style: italic; font-size: 14px; line-height: 1.7;
  }

  /* ── WEEK VIEW ───────────────────────────── */
  .week-nav-wrapper {
    display: flex; flex-direction: column; align-items: center;
    padding: 26px 20px 0;
  }
  .counter {
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 9px; scroll-margin-top: 16px;
  }
  .progress-bar-track {
    width: min(540px, 94%); height: 3px; background: var(--border);
    border-radius: 2px; margin-bottom: 20px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: var(--accent); border-radius: 2px;
    transition: width 0.35s ease;
  }
  .card-wrapper { display: flex; justify-content: center; padding: 0 18px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: 0 4px 24px var(--shadow);
    width: min(540px, 100%); overflow: hidden;
    animation: slideIn 0.28s ease forwards;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card-header {
    padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 14px;
  }
  .card-icon {
    font-size: 20px; background: var(--accent-pale);
    border: 1px solid var(--accent-light); border-radius: 11px;
    width: 42px; height: 42px; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
  }
  .card-title { font-size: 17px; font-weight: bold; line-height: 1.2; }
  .card-subtitle { font-style: italic; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .card-body { padding: 18px 24px 24px; }

  /* ── CONTENT COMPONENTS ──────────────────── */
  .stat-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .stat-pill {
    background: var(--accent-pale); border: 1px solid var(--accent-light);
    border-radius: 20px; padding: 5px 12px; font-size: 12.5px;
  }
  .stat-pill strong { color: var(--accent); }

  ul { list-style: none; }
  ul li {
    padding: 9px 0 9px 19px; position: relative; font-size: 13.5px;
    line-height: 1.65; border-bottom: 1px solid var(--border);
  }
  ul li:last-child { border-bottom: none; }
  ul li::before {
    content: '·'; color: var(--accent); position: absolute;
    left: 3px; top: 8px; font-size: 20px; line-height: 1.3;
  }

  ol.steps { list-style: none; counter-reset: steps; }
  ol.steps li {
    counter-increment: steps; padding: 9px 0 9px 40px;
    position: relative; font-size: 13.5px; line-height: 1.65;
    border-bottom: 1px solid var(--border);
  }
  ol.steps li:last-child { border-bottom: none; }
  ol.steps li::before {
    content: counter(steps); position: absolute; left: 0; top: 10px;
    background: var(--accent); color: white; width: 24px; height: 24px;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 11px;
  }

  .info-box {
    border-radius: 10px; padding: 13px 15px; font-size: 13px;
    line-height: 1.6; margin-top: 13px;
  }
  .info-box strong {
    display: block; margin-bottom: 3px; font-size: 10.5px;
    letter-spacing: 0.09em; text-transform: uppercase;
  }
  .info-box.warm  { background: var(--accent-pale); border: 1px solid var(--accent-light); color: var(--warm-brown); }
  .info-box.warm strong { color: var(--accent); }
  .info-box.green { background: var(--green-pale); border: 1px solid #BDD4BD; color: #3A5A3A; }
  .info-box.green strong { color: var(--green); }
  .info-box.blue  { background: var(--blue-pale);  border: 1px solid #BDD0E0; color: #2A4A6A; }
  .info-box.blue strong  { color: var(--blue); }
  .info-box.amber { background: var(--gold-pale);  border: 1px solid #D4B87A; color: #5A4010; }
  .info-box.amber strong { color: var(--gold); }

  .diff-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
  .diff-col { border-radius: 10px; padding: 11px 13px; font-size: 12.5px; line-height: 1.6; }
  .diff-col.left  { background: var(--blue-pale);  border: 1px solid #BDD0E0; color: #2A4A6A; }
  .diff-col.right { background: var(--gold-pale);  border: 1px solid #D4B87A; color: #5A4010; }
  .diff-col strong { display: block; font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 4px; }
  .diff-col.left strong { color: var(--blue); }
  .diff-col.right strong { color: var(--gold); }

  .latch-check { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
  .latch-ok, .latch-no { border-radius: 10px; padding: 13px; font-size: 12.5px; line-height: 1.6; }
  .latch-ok { background: var(--green-pale); border: 1px solid #BDD4BD; color: #3A5A3A; }
  .latch-no { background: #FFF0F0; border: 1px solid #E0BDBD; color: #6A2A2A; }
  .latch-ok strong, .latch-no strong { display: block; margin-bottom: 3px; font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; }

  .gender-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
  .gender-col { border-radius: 10px; padding: 11px 13px; font-size: 12.5px; line-height: 1.6; }
  .gender-col.boy  { background: #E8F0F7; border: 1px solid #BDD0E0; color: #2A4060; }
  .gender-col.girl { background: #FBF0F5; border: 1px solid #E0BDCF; color: #6A2A50; }
  .gender-col strong { display: block; font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 4px; }
  .gender-col.boy strong  { color: var(--blue); }
  .gender-col.girl strong { color: #C4608A; }

  .section-label {
    font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--muted); margin: 16px 0 9px;
  }

  /* ── WEEK NAV BUTTONS & DOTS ─────────────── */
  .nav-buttons {
    display: flex; justify-content: center; gap: 10px;
    padding: 20px 20px 14px;
  }
  .btn {
    font-family: Georgia, serif; font-size: 13.5px;
    padding: 9px 24px; border-radius: 8px; cursor: pointer;
    transition: all 0.2s ease; border: 2px solid var(--accent);
    min-width: 90px;
  }
  .btn-outline { background: transparent; color: var(--accent); }
  .btn-outline:hover:not(:disabled), .btn-outline:active:not(:disabled) {
    background: var(--accent); color: white; transform: translateY(-1px);
  }
  .btn-solid { background: var(--accent); color: white; }
  .btn-solid:hover:not(:disabled), .btn-solid:active:not(:disabled) {
    background: #A85A38; transform: translateY(-1px);
  }
  .btn:disabled { opacity: 0.32; cursor: not-allowed; transform: none; }

  .dots { display: flex; justify-content: center; gap: 7px; padding-bottom: 36px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--border);
    cursor: pointer; transition: all 0.2s ease; border: none; padding: 0;
  }
  .dot.active { background: var(--accent); width: 10px; height: 10px; }
  .dot:hover  { background: var(--accent-light); }

  .week-footer {
    text-align: center; font-style: italic; font-size: 11px;
    color: var(--muted); padding: 0 20px 32px;
  }

  /* ── RESPONSIVE ──────────────────────────── */
  @media (max-width: 480px) {
    .diff-row, .latch-check, .gender-grid { grid-template-columns: 1fr; }
    .week-grid { grid-template-columns: 1fr; }
    .btn { padding: 8px 18px; font-size: 13px; }
    .card-header { padding: 16px 18px 13px; }
    .card-body { padding: 14px 18px 20px; }
  }
</style>
</head>
<body>

<!-- SHARED HEADER (dynamic) -->
<div class="header" id="header">
  <div class="header-top-label" id="header-label">Baby Reference Guide</div>
  <h1 id="header-title">Peek-a-Week 🍼</h1>
  <p class="header-sub" id="header-sub">Your baby, week by week</p>
</div>

<!-- BACK BAR (visible in week view) -->
<div class="back-bar" id="back-bar" onclick="showIndex()">
  <span class="back-arrow">←</span>
  <span>All weeks</span>
</div>

<!-- INDEX VIEW -->
<div id="view-index">
  <div class="search-bar-wrapper">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text"
        placeholder="Search all weeks…" autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false">
      <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="Clear">×</button>
    </div>
  </div>
  <div class="search-results" id="searchResults"></div>
  <div class="index-main" id="index-main"></div>
</div>

<!-- WEEK VIEW -->
<div id="view-week">
  <div class="week-nav-wrapper">
    <div class="counter" id="counter">Card 1 of 1</div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>
  <div class="card-wrapper">
    <div class="card" id="card"></div>
  </div>
  <div class="nav-buttons">
    <button class="btn btn-outline" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="btn btn-solid"   id="nextBtn" onclick="navigate(1)">Next →</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="week-footer"><em>Source: Your Baby Week by Week</em> — all content sourced directly from the book</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// WEEKS DATA — add new entries here as new pages are generated
// ═══════════════════════════════════════════════════════════════
const WEEKS = {
  0: {
    title: "Your Newborn Has Arrived",
    subtitle: "The very first days at home",
    topics: ["Nappies", "Washing", "Cord Stump", "Feeding", "Breastfeeding", "Latching On"],
    cards: [
      {
        icon: '🩹', title: 'Nappies', subtitle: 'What to expect in the first week',
        content: `
          <div class="stat-row">
            <div class="stat-pill">Wet nappies / 24h: <strong>8–12</strong></div>
            <div class="stat-pill">Dirty nappies / 24h: <strong>0–12</strong></div>
            <div class="stat-pill">Change frequency: <strong>~every 3 hours</strong></div>
          </div>
          <div class="section-label">Wet nappies &amp; hydration</div>
          <ul>
            <li>Fewer than <strong>6 wet nappies</strong> in 24 hours can indicate dehydration — as can dark, yellow urine</li>
            <li>Urine should be <strong>almost colourless</strong>; nappies should feel heavy</li>
            <li>More than <strong>8 wet nappies</strong> a day shows your baby is getting plenty of fluid</li>
          </ul>
          <div class="section-label">What dirty nappies look like</div>
          <ul>
            <li><strong>First few days:</strong> meconium — sticky, thick, black-green stools with very little smell; made of digested mucus from the womb</li>
            <li>As milk comes in, bowel movements gradually change to <strong>brown-yellow</strong> and may become 'explosive' — this takes another few days</li>
          </ul>
          <div class="diff-row">
            <div class="diff-col left"><strong>🤱 Breastfed</strong>Light yellow and runny, looking much like French mustard</div>
            <div class="diff-col right"><strong>🍼 Bottle-fed</strong>More solid and browner in colour</div>
          </div>
          <div class="info-box warm">
            <strong>Handy tip</strong>
            Peep in the leg-hole to see if he's dirty and needs changing — no need to undress him every time.
          </div>`
      },
      {
        icon: '🛁', title: 'Washing & Top and Tail', subtitle: 'Daily face and bottom wash — no bath needed yet',
        content: `
          <div class="info-box green">
            <strong>This week</strong>
            You don't have to bath your baby this week, although you might like to if your midwife is around to show you how. But you should 'top and tail' every day — washing his face and bottom.
          </div>
          <div class="section-label">What you need</div>
          <ul>
            <li>Cotton wool and warm water — boiled and cooled is best, but tap water is okay</li>
            <li><strong>Separate bowls</strong> for face and bottom; no soap or shampoo needed</li>
            <li>Use <strong>100% cotton wool</strong> — more absorbent than mixed fibre; use it to dry him too</li>
          </ul>
          <div class="section-label">Step by step</div>
          <ol class="steps">
            <li>Wipe each eye with a <strong>separate piece</strong> of wet cotton wool</li>
            <li>Clean the rest of the face — under the chin and behind the ears (not inside the ears)</li>
            <li>Clean the scalp — dry with cotton wool; if he has a lot of hair, use a hairdryer on a cool, low setting</li>
            <li>Make sure the <strong>face is dry</strong> before washing the bottom, so baby doesn't feel cold</li>
            <li>Use the old nappy to wipe away any poo first, then clean around the bottom and creases with wet cotton wool</li>
            <li>Dry the bottom with cotton wool</li>
          </ol>

// ───────────────────────────── Router ─────────────────────────
let currentCard = 0;
let currentWeek = null;

function showIndex() {
  currentWeek = null;
  document.getElementById('view-index').style.display = 'block';
  document.getElementById('view-week').style.display = 'none';
  document.getElementById('back-bar').classList.remove('visible');
  document.getElementById('header-label').textContent = 'Baby Reference Guide';
  document.getElementById('header-title').textContent = 'Peek-a-Week 🍼';
  document.getElementById('header-sub').textContent = 'Your baby, week by week';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showWeek(weekNum) {
  const week = WEEKS[weekNum];
  if (!week) return;
  currentWeek = weekNum;
  currentCard = 0;

  document.getElementById('view-index').style.display = 'none';
  document.getElementById('view-week').style.display = 'block';
  document.getElementById('back-bar').classList.add('visible');

  document.getElementById('header-label').textContent = `Week ${weekNum}`;
  document.getElementById('header-title').textContent = week.title;
  document.getElementById('header-sub').textContent = week.subtitle;

  // Build dots
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  week.cards.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', `Go to card ${i + 1}`);
    dot.onclick = () => { currentCard = i; renderCard(); };
    dotsEl.appendChild(dot);
  });

  renderCard();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderCard() {
  const week = WEEKS[currentWeek];
  const total = week.cards.length;
  const card = week.cards[currentCard];

  document.getElementById('counter').textContent = `Card ${currentCard + 1} of ${total}`;
  document.getElementById('progressBar').style.width = `${((currentCard + 1) / total) * 100}%`;

  const cardEl = document.getElementById('card');
  cardEl.style.animation = 'none';
  cardEl.offsetHeight;
  cardEl.style.animation = '';
  cardEl.innerHTML = `
    <div class="card-header">
      <div class="card-icon">${card.icon}</div>
      <div>
        <div class="card-title">${card.title}</div>
        <div class="card-subtitle">${card.subtitle}</div>
      </div>
    </div>
    <div class="card-body">${card.content}</div>
  `;

  document.getElementById('prevBtn').disabled = currentCard === 0;
  document.getElementById('nextBtn').disabled = currentCard === total - 1;

  document.querySelectorAll('.dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentCard);
  });

  document.getElementById('counter').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function navigate(dir) {
  const week = WEEKS[currentWeek];
  currentCard = Math.max(0, Math.min(week.cards.length - 1, currentCard + dir));
  renderCard();
}

  const available = Object.keys(WEEKS).map(Number).sort((a, b) => a - b);

  if (available.length) {

    available.forEach(n => {

      div.className = 'week-card';
      div.onclick = () => showWeek(n);
      div.innerHTML = `
        <div class="wc-num">Week ${n}</div>
        <div class="wc-title">${w.title}</div>
        <div class="wc-sub">${w.subtitle}</div>

    main.appendChild(divider);

    h2.className = 'section-heading';
    h2.textContent = 'Coming soon';
    main.appendChild(h2);

// ───────────────────────── Search ─────────────────────────────
function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
}

// Build a flat index of every card across all weeks
const SEARCH_INDEX = (() => {
  const idx = [];
  Object.keys(WEEKS).map(Number).sort((a, b) => a - b).forEach(n => {
    WEEKS[n].cards.forEach((card, i) => {
      idx.push({
        weekNum: n,
        cardIdx: i,
        icon: card.icon,
        title: card.title,
        subtitle: card.subtitle,
        text: stripHtml(card.content || '')
      });
    });
  });
  return idx;
})();

function getExcerpt(text, query, maxLen = 130) {
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  const lower = text.toLowerCase();
  let pos = -1;
  for (const t of terms) { pos = lower.indexOf(t); if (pos !== -1) break; }
  let start = Math.max(0, pos - 40);
  let excerpt = (start > 0 ? '…' : '') + text.slice(start, start + maxLen) + (start + maxLen < text.length ? '…' : '');
  terms.forEach(t => {
    if (!t) return;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    excerpt = excerpt.replace(re, m => `<mark>${m}</mark>`);
  });
  return excerpt;
}

let searchTimer = null;

function doSearch(raw) {
  const query = raw.trim();
  const resultsEl = document.getElementById('searchResults');
  const mainEl    = document.getElementById('index-main');
  const clearBtn  = document.getElementById('searchClear');

  clearBtn.classList.toggle('visible', raw.length > 0);

  if (!query) {
    resultsEl.classList.remove('visible');
    resultsEl.innerHTML = '';
    mainEl.style.display = '';
    return;
  }

  mainEl.style.display = 'none';
  resultsEl.classList.add('visible');

  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = SEARCH_INDEX.filter(item => {
    const hay = `${item.title} ${item.subtitle} ${item.text}`.toLowerCase();
    return terms.every(t => hay.includes(t));
  });

  if (!hits.length) {
    resultsEl.innerHTML = `
      <div class="search-results-label">No results</div>
      <div class="search-no-results">Nothing found for "<strong>${query}</strong>"<br>Try a different word</div>`;
    return;
  }

  resultsEl.innerHTML = `<div class="search-results-label">${hits.length} result${hits.length !== 1 ? 's' : ''}</div>`;
  hits.forEach(item => {
    const div = document.createElement('div');
    div.className = 'search-result-item';
    div.innerHTML = `
      <div class="search-result-icon">${item.icon}</div>
      <div class="search-result-body">
        <div class="search-result-week">Week ${item.weekNum}</div>
        <div class="search-result-title">${item.title}</div>
        <div class="search-result-excerpt">${getExcerpt(item.text || item.subtitle, query)}</div>
      </div>`;
    div.onclick = () => {
      clearSearch();
      showWeek(item.weekNum);
      currentCard = item.cardIdx;
      renderCard();
    };
    resultsEl.appendChild(div);
  });
}

function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  doSearch('');
  input.focus();
}

document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(e.target.value), 150);
});
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSearch();
});
