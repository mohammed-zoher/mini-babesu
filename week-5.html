<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 5 — Peek-a-Week 🍼</title>
<style>
  :root {
    --cream: #FDF6EE;
    --card-bg: #FFFCF8;
    --warm-brown: #5C3D2E;
    --muted: #8C7060;
    --accent: #C4704A;
    --accent-light: #F0D9CC;
    --accent-pale: #FAF0EA;
    --border: #EAD9CC;
    --shadow: rgba(92,61,46,0.08);
    --green: #5A7A5A;
    --green-pale: #EBF2EB;
    --blue: #4A6A8A;
    --blue-pale: #E8F0F7;
    --gold: #A07A3A;
    --gold-pale: #F5EDD8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--warm-brown);
    min-height: 100vh;
  }

  .header {
    background: var(--warm-brown);
    background-image: radial-gradient(ellipse at 70% 50%, rgba(196,112,74,0.3) 0%, transparent 70%);
    padding: 52px 24px 44px;
    text-align: center;
    color: var(--cream);
  }
  .header .week-label {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent-light); margin-bottom: 12px;
  }
  .header h1 {
    font-size: clamp(26px, 5vw, 40px); font-weight: normal;
    letter-spacing: -0.01em; color: #FDF6EE; margin-bottom: 10px;
  }
  .header .subtitle {
    font-style: italic; font-size: 15px;
    color: rgba(253,246,238,0.6); max-width: 400px; margin: 0 auto;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent-light); text-decoration: none; padding: 14px 24px 0;
  }
  .back-link:hover { color: white; }

  .counter {
    text-align: center; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent); padding: 28px 24px 10px;
    scroll-margin-top: 16px;
  }
  .progress-wrap {
    max-width: min(560px, 94%); margin: 0 auto 24px;
    height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s ease;
  }

  .card-wrap { display: flex; justify-content: center; padding: 0 24px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 18px; box-shadow: 0 4px 28px var(--shadow);
    width: min(560px, 100%); overflow: hidden; animation: slideIn 0.3s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 26px 28px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 16px;
  }
  .card-icon {
    font-size: 22px; background: var(--accent-pale); border-radius: 12px;
    padding: 10px 12px; line-height: 1; flex-shrink: 0;
  }
  .card-title { font-size: 19px; font-weight: bold; color: var(--warm-brown); margin-bottom: 3px; line-height: 1.2; }
  .card-subtitle { font-style: italic; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .card-body { padding: 24px 28px 28px; }

  .stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .stat-pill {
    background: var(--accent-pale); border: 1px solid var(--accent-light);
    border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--warm-brown);
  }
  .stat-pill strong { color: var(--accent); }

  ul { list-style: none; padding: 0; }
  ul li {
    padding: 10px 0 10px 20px; position: relative;
    font-size: 14px; line-height: 1.65; border-bottom: 1px solid var(--border);
    color: var(--warm-brown);
  }
  ul li:last-child { border-bottom: none; }
  ul li::before {
    content: '·'; position: absolute; left: 4px;
    color: var(--accent); font-size: 18px; line-height: 1.4;
  }

  ol.steps { list-style: none; padding: 0; counter-reset: steps; }
  ol.steps li {
    padding: 10px 0 10px 42px; position: relative; font-size: 14px;
    line-height: 1.65; border-bottom: 1px solid var(--border); counter-increment: steps;
  }
  ol.steps li:last-child { border-bottom: none; }
  ol.steps li::before {
    content: counter(steps); position: absolute; left: 0; top: 10px;
    width: 26px; height: 26px; background: var(--accent); color: white;
    border-radius: 50%; font-size: 12px; display: flex;
    align-items: center; justify-content: center; font-family: Georgia, serif;
  }

  .info-box { border-radius: 10px; padding: 14px 16px; font-size: 13.5px; line-height: 1.6; margin-top: 14px; }
  .info-box strong { display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  .info-box.warm  { background: var(--accent-pale); border: 1px solid var(--accent-light); color: var(--warm-brown); }
  .info-box.warm strong { color: var(--accent); }
  .info-box.green { background: var(--green-pale); border: 1px solid #C2D9C2; color: #2E4A2E; }
  .info-box.green strong { color: var(--green); }
  .info-box.blue  { background: var(--blue-pale); border: 1px solid #C0D0DF; color: #1E3045; }
  .info-box.blue strong { color: var(--blue); }
  .info-box.amber { background: var(--gold-pale); border: 1px solid #DEC89A; color: #4A3010; }
  .info-box.amber strong { color: var(--gold); }

  .section-label {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin: 18px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }

  .diff-row { display: flex; gap: 10px; margin-top: 14px; margin-bottom: 14px; }
  .diff-col { flex: 1; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.55; }
  .diff-col.left  { background: var(--blue-pale); border: 1px solid #C0D0DF; color: #1E3045; }
  .diff-col.right { background: var(--gold-pale); border: 1px solid #DEC89A; color: #4A3010; }
  .diff-col strong { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
  .diff-col.left strong { color: var(--blue); }
  .diff-col.right strong { color: var(--gold); }

  .nav {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; padding: 24px 24px 10px;
  }
  .btn {
    font-family: Georgia, serif; font-size: 14px; padding: 10px 28px;
    border-radius: 24px; cursor: pointer; transition: all 0.18s ease; border: 1.5px solid var(--accent);
  }
  .btn-prev { background: transparent; color: var(--accent); }
  .btn-prev:hover:not(:disabled) { background: var(--accent); color: white; transform: translateY(-1px); }
  .btn-next { background: var(--accent); color: white; }
  .btn-next:hover:not(:disabled) { background: #A85A38; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.3; cursor: default; transform: none; }

  .dots { display: flex; justify-content: center; gap: 7px; padding: 12px 24px 32px; flex-wrap: wrap; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--border);
    cursor: pointer; transition: all 0.2s ease; border: none; padding: 0;
  }
  .dot.active { background: var(--accent); transform: scale(1.3); }

  footer {
    text-align: center; font-style: italic; font-size: 11px;
    color: var(--muted); padding: 0 24px 36px;
  }

  @media (max-width: 500px) {
    .card-header { padding: 20px 18px 16px; }
    .card-body { padding: 18px 18px 22px; }
    .btn { padding: 9px 20px; font-size: 13px; }
    .diff-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">← All weeks</a>
  <div class="week-label">Week 5</div>
  <h1>Growing Awareness</h1>
  <p class="subtitle">The six-week check approaches — sleep settles and the world comes into focus</p>
</div>

<div class="counter" id="counter">Card 1 of 7</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:14.28%"></div></div>

<div class="card-wrap"><div class="card" id="card"></div></div>

<div class="nav">
  <button class="btn btn-prev" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
  <button class="btn btn-next" id="nextBtn" onclick="navigate(1)">Next →</button>
</div>
<div class="dots" id="dots"></div>

<footer><em>Source: Your Baby Week by Week</em> — all content sourced directly from the book</footer>

<script>
const cards = [
  {
    icon: '🍼',
    title: 'Feeding',
    subtitle: 'Daily amounts, fore & hind milk, and the grazing habit',
    content: `
      <div class="stat-row">
        <div class="stat-pill">Daily total: <strong>660–900 ml / 23–31 oz</strong></div>
        <div class="stat-pill">Per feed: <strong>up to 135 ml / 4.5 oz</strong></div>
        <div class="stat-pill">Feeds per day: <strong>7–10</strong></div>
      </div>
      <div class="section-label">Breastfeeding — fore & hind milk</div>
      <div class="diff-row">
        <div class="diff-col left">
          <strong>Fore milk</strong>
          Watery and sweet. Comes first — quenches your baby's thirst.
        </div>
        <div class="diff-col right">
          <strong>Hind milk</strong>
          Fat-rich, high in calories. Comes later — satisfies and fills your baby up.
        </div>
      </div>
      <ul>
        <li>Let your baby feed for at least 20 minutes from one breast before offering the other — this ensures he gets both the thirst-quenching fore milk and the calorie-rich hind milk.</li>
      </ul>
      <div class="info-box warm">
        <strong>Your baby's emotions</strong>
        Sometimes your baby's cry sounds fake — but he is genuinely emotional, even at this stage.
      </div>
      <div class="section-label">Bottle-feeding — breaking the grazing habit</div>
      <ul>
        <li>Some babies develop a grazing habit — lots of small, frequent feeds instead of proper full ones.</li>
        <li>To break it: when your baby starts to cry for a feed, wait an extra five minutes before giving it. Then gradually extend the gap each day until proper full feeds are re-established.</li>
      </ul>
    `
  },
  {
    icon: '🩹',
    title: 'Nappies',
    subtitle: 'What to expect — and why the straining is normal',
    content: `
      <div class="stat-row">
        <div class="stat-pill">Wet nappies: <strong>4–8 per day</strong></div>
        <div class="stat-pill">Dirty nappies: <strong>0–8 per day</strong></div>
      </div>
      <ul>
        <li>Your baby may strain and go red in the face when he has a poo — this is completely normal at this age.</li>
        <li>His anus muscles are not fully relaxed yet, and babies poo lying down, which doesn't help gravity. The straining simply reflects the effort needed.</li>
        <li>This usually settles by around week 10 as his muscles mature and his body becomes stronger.</li>
      </ul>
      <div class="info-box green">
        <strong>Reassurance</strong>
        Straining and going red when pooing is normal — it does not mean your baby is constipated.
      </div>
    `
  },
  {
    icon: '🛁',
    title: 'Cradle Cap',
    subtitle: 'Crusty yellow-brown flakes — harmless and treatable',
    content: `
      <ul>
        <li>Cradle cap appears as crusty yellow-brown flakes on your baby's scalp. It is not itchy and is not painful.</li>
        <li>It is a harmless condition and is unlikely to persist beyond 6 months.</li>
      </ul>
      <div class="section-label">Treatment — step by step</div>
      <ol class="steps">
        <li>Apply olive oil to the scalp and gently brush to loosen the flakes before bath time.</li>
        <li>At bedtime, put a few drops of tea tree oil into a small amount of olive oil and apply to the scalp. Leave overnight.</li>
        <li>If the above doesn't help, try a medicated shampoo — ask your pharmacist which one to use for babies.</li>
      </ol>
      <div class="info-box amber">
        <strong>⚠ Never pick</strong>
        Do not pick at the flakes. This can cause bleeding and risks introducing infection to your baby's scalp.
      </div>
    `
  },
  {
    icon: '🌱',
    title: 'Development & Play',
    subtitle: 'Eye tracking, floor time, and a critical safety tip',
    content: `
      <ul>
        <li><strong>Eye tracking:</strong> your baby can now track a moving object with his eyes — a significant new development in his visual awareness of the world around him.</li>
      </ul>
      <div class="section-label">Car seat vs floor time</div>
      <ul>
        <li>Limit time spent in the car seat at home — it restricts movement and means less muscle development.</li>
        <li>A bouncy seat is a better option than a car seat for home use.</li>
        <li>The best place for your baby is the floor — front or back — where he can move freely and build strength.</li>
      </ul>
      <div class="info-box amber">
        <strong>⚠ Safety — never clean bottle teats with salt</strong>
        Your baby's kidneys are still immature and cannot excrete salt efficiently. Cleaning teats with salt and rinsing inadequately can cause salt levels in your baby's blood to rise to dangerously high — and potentially lethal — levels.
      </div>
    `
  },
  {
    icon: '😴',
    title: 'Sleep',
    subtitle: 'Night and day are beginning to separate',
    content: `
      <div class="stat-row">
        <div class="stat-pill">Sleep needed: <strong>14–17 hours/day</strong></div>
        <div class="stat-pill">Trend: <strong>more at night now</strong></div>
      </div>
      <ul>
        <li>Your baby is beginning to differentiate night from day — sleeping more during the night than in the earlier weeks.</li>
        <li>This is a gradual shift, but a welcome and important one. Longer night stretches are becoming more possible.</li>
      </ul>
      <div class="info-box green">
        <strong>Encouraging sign</strong>
        The move towards more nighttime sleep is the first step toward a proper sleep pattern forming — it is coming.
      </div>
    `
  },
  {
    icon: '🛏',
    title: 'Co-sleeping',
    subtitle: 'When it is safe — and when it is not',
    content: `
      <div class="info-box blue">
        <strong>Safest option</strong>
        The NHS recommends your baby sleeps in his own cot, in your room, for the first 6 months.
      </div>
      <div class="section-label">Do NOT co-sleep if any of these apply</div>
      <ul>
        <li>Either parent smokes — even if only outside the home.</li>
        <li>Either parent has drunk alcohol.</li>
        <li>Either parent has taken drugs, including some prescription medications that cause drowsiness.</li>
        <li>You are extremely exhausted.</li>
        <li>You or your partner is obese.</li>
        <li>Your baby was premature or had a low birth weight.</li>
      </ul>
      <div class="section-label">If you do co-sleep — follow all of these rules</div>
      <ul>
        <li>Use a firm mattress. Never use a waterbed.</li>
        <li>Keep pillows to a minimum and away from your baby.</li>
        <li>Use a cotton sheet, not a duvet — a duvet can overheat or smother your baby.</li>
        <li>Do not place your baby between yourself and your partner — put him on the outside edge.</li>
        <li>Do not let your baby sleep in a sleeping bag while in the bed.</li>
        <li>Always tell your partner that the baby is in the bed before you fall asleep.</li>
      </ul>
    `
  },
  {
    icon: '🩺',
    title: '6-Week Check-up & Thrush',
    subtitle: 'What the GP checks — and signs of oral thrush',
    content: `
      <div class="section-label">6-Week check-up — bring your Red Book</div>
      <ul>
        <li>The GP will check your baby's eyes, ears, hips, heart, and spine.</li>
        <li><strong>Heart murmur</strong> is found in around 1 in 200 babies — many are innocent and resolve on their own without treatment.</li>
        <li><strong>Hip dysplasia</strong> affects 1–2 in every 1,000 babies. It is treated much more easily when caught early at this check.</li>
        <li>The GP will also ask developmental assessment questions — about how your baby is feeding, responding, and moving.</li>
        <li>Mothers also have their own 6-week check at this appointment — don't forget to raise any concerns about your own recovery.</li>
      </ul>
      <div class="section-label">Oral thrush</div>
      <ul>
        <li>Oral thrush (Candida albicans) is a fungal infection that can develop in your baby's mouth.</li>
        <li>Signs: white spots on the tongue and inside of the cheeks. It can make feeding difficult or uncomfortable for your baby.</li>
        <li>See your GP if you suspect thrush — it is easily treated with antifungal drops.</li>
      </ul>
      <div class="info-box warm" style="text-align:center;font-style:italic;font-size:14px;margin-top:16px;">
        You made it through Week 5 🎉
      </div>
    `
  }
];

let current = 0;
const total = cards.length;

function renderCard() {
  const card = cards[current];
  const el = document.getElementById('card');
  el.style.animation = 'none'; el.offsetHeight; el.style.animation = '';
  el.innerHTML = `
    <div class="card-header">
      <div class="card-icon">${card.icon}</div>
      <div class="card-header-text">
        <div class="card-title">${card.title}</div>
        <div class="card-subtitle">${card.subtitle}</div>
      </div>
    </div>
    <div class="card-body">${card.content}</div>
  `;
  document.getElementById('counter').textContent = `Card ${current + 1} of ${total}`;
  document.getElementById('progressBar').style.width = `${((current + 1) / total) * 100}%`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  document.getElementById('counter').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function navigate(dir) {
  current = Math.max(0, Math.min(total - 1, current + dir));
  renderCard();
}

const dotsEl = document.getElementById('dots');
cards.forEach((_, i) => {
  const dot = document.createElement('button');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.setAttribute('aria-label', `Card ${i + 1}`);
  dot.onclick = () => { current = i; renderCard(); };
  dotsEl.appendChild(dot);
});

renderCard();
</script>
</body>
</html>
