<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 3 — Your Baby Week by Week</title>
<style>
  :root {
    --cream: #FDF6EE;
    --card-bg: #FFFCF8;
    --warm-brown: #5C3D2E;
    --muted: #8C7060;
    --accent: #C4704A;
    --accent-light: #F0D9CC;
    --accent-pale: #FAF0EA;
    --border: #EAD9CC;
    --shadow: rgba(92,61,46,0.08);
    --green: #5A7A5A;
    --green-pale: #EBF2EB;
    --blue: #4A6A8A;
    --blue-pale: #E8F0F7;
    --gold: #A07A3A;
    --gold-pale: #F5EDD8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--warm-brown);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--warm-brown);
    background-image: radial-gradient(ellipse at 70% 50%, rgba(196,112,74,0.3) 0%, transparent 70%);
    padding: 52px 24px 44px;
    text-align: center;
    color: var(--cream);
  }
  .header .week-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-light);
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: clamp(26px, 5vw, 40px);
    font-weight: normal;
    letter-spacing: -0.01em;
    color: #FDF6EE;
    margin-bottom: 10px;
  }
  .header .subtitle {
    font-style: italic;
    font-size: 15px;
    color: rgba(253,246,238,0.6);
    max-width: 400px;
    margin: 0 auto;
  }

  /* COUNTER & PROGRESS */
  .counter {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 28px 24px 10px;
  }
  .progress-wrap {
    max-width: min(560px, 94%);
    margin: 0 auto 24px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.35s ease;
  }

  /* CARD */
  .card-wrap {
    display: flex;
    justify-content: center;
    padding: 0 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 4px 28px var(--shadow);
    width: min(560px, 100%);
    overflow: hidden;
    animation: slideIn 0.3s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* CARD HEADER */
  .card-header {
    padding: 26px 28px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .card-icon {
    font-size: 22px;
    background: var(--accent-pale);
    border-radius: 12px;
    padding: 10px 12px;
    line-height: 1;
    flex-shrink: 0;
  }
  .card-header-text {}
  .card-title {
    font-size: 19px;
    font-weight: bold;
    color: var(--warm-brown);
    margin-bottom: 3px;
    line-height: 1.2;
  }
  .card-subtitle {
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* CARD BODY */
  .card-body {
    padding: 24px 28px 28px;
  }

  /* STAT PILLS */
  .stat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .stat-pill {
    background: var(--accent-pale);
    border: 1px solid var(--accent-light);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--warm-brown);
  }
  .stat-pill strong { color: var(--accent); }

  /* BULLET LIST */
  ul {
    list-style: none;
    padding: 0;
  }
  ul li {
    padding: 10px 0 10px 20px;
    position: relative;
    font-size: 14px;
    line-height: 1.65;
    border-bottom: 1px solid var(--border);
    color: var(--warm-brown);
  }
  ul li:last-child { border-bottom: none; }
  ul li::before {
    content: '·';
    position: absolute;
    left: 4px;
    color: var(--accent);
    font-size: 18px;
    line-height: 1.4;
  }

  /* NUMBERED STEPS */
  ol.steps {
    list-style: none;
    padding: 0;
    counter-reset: steps;
  }
  ol.steps li {
    padding: 10px 0 10px 42px;
    position: relative;
    font-size: 14px;
    line-height: 1.65;
    border-bottom: 1px solid var(--border);
    counter-increment: steps;
  }
  ol.steps li:last-child { border-bottom: none; }
  ol.steps li::before {
    content: counter(steps);
    position: absolute;
    left: 0;
    top: 10px;
    width: 26px;
    height: 26px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
  }

  /* INFO BOXES */
  .info-box {
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13.5px;
    line-height: 1.6;
    margin-top: 14px;
  }
  .info-box strong { display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  .info-box.warm  { background: var(--accent-pale); border: 1px solid var(--accent-light); color: var(--warm-brown); }
  .info-box.warm strong { color: var(--accent); }
  .info-box.green { background: var(--green-pale); border: 1px solid #C2D9C2; color: #2E4A2E; }
  .info-box.green strong { color: var(--green); }
  .info-box.blue  { background: var(--blue-pale); border: 1px solid #C0D0DF; color: #1E3045; }
  .info-box.blue strong { color: var(--blue); }
  .info-box.amber { background: var(--gold-pale); border: 1px solid #DEC89A; color: #4A3010; }
  .info-box.amber strong { color: var(--gold); }

  /* SECTION LABEL */
  .section-label {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 18px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }

  /* NAV */
  .nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 24px 24px 10px;
  }
  .btn {
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 10px 28px;
    border-radius: 24px;
    cursor: pointer;
    transition: all 0.18s ease;
    border: 1.5px solid var(--accent);
  }
  .btn-prev {
    background: transparent;
    color: var(--accent);
  }
  .btn-prev:hover:not(:disabled) {
    background: var(--accent);
    color: white;
    transform: translateY(-1px);
  }
  .btn-next {
    background: var(--accent);
    color: white;
  }
  .btn-next:hover:not(:disabled) {
    background: #A85A38;
    transform: translateY(-1px);
  }
  .btn:disabled {
    opacity: 0.3;
    cursor: default;
    transform: none;
  }

  /* DOTS */
  .dots {
    display: flex;
    justify-content: center;
    gap: 7px;
    padding: 12px 24px 32px;
    flex-wrap: wrap;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
    padding: 0;
  }
  .dot.active {
    background: var(--accent);
    transform: scale(1.3);
  }

  /* FOOTER */
  footer {
    text-align: center;
    font-style: italic;
    font-size: 11px;
    color: var(--muted);
    padding: 0 24px 36px;
  }

  /* BACK LINK */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-light);
    text-decoration: none;
    padding: 14px 24px 0;
  }
  .back-link:hover { color: white; }

  @media (max-width: 500px) {
    .card-header { padding: 20px 18px 16px; }
    .card-body { padding: 18px 18px 22px; }
    .btn { padding: 9px 20px; font-size: 13px; }
  }
</style>
</head>

</div>

<div class="dots" id="dots"></div>

<footer>

      <ul>
        <li>Colic attacks usually occur at the same time each day — give a bath before the attack, not during, to help relax tummy muscles.</li>

        <li>Although your baby recognises your smell, voice and face, he still only sees your outline — he's a few weeks off being able to pay attention to your features.</li>
        <li>A drastic haircut, a ponytail, or wearing a hat will make it harder for him to recognise you. When playing with him, keep your face close to his.</li>
        <li>Your baby's movements are involuntary but crucial for development. Every time he moves, his brain's messaging system becomes more developed as he learns to link the feel of an object with what it looks like and where his hand is in space.</li>
      </ul>
      <div class="info-box amber">
        <strong>⚠ Safety tip — warming milk</strong>
        Never use a microwave to warm formula or expressed milk — it can create pockets of extremely hot milk that could burn your baby. Use a bowl of hot water, run the bottle under warm water, or use an electric bottle warmer. Always shake well and test the temperature before feeding.
      </div>
      <div class="info-box warm">
        <strong>You made it through Week 3 🎉</strong>
        Colic is exhausting — you're doing brilliantly.
      </div>
    `
  }
];

let current = 0;
const total = cards.length;

function renderCard() {
  const card = cards[current];
  const el = document.getElementById('card');

  // Force reflow for animation retrigger
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = '';

  el.innerHTML = `
    <div class="card-header">
      <div class="card-icon">${card.icon}</div>
      <div class="card-header-text">
        <div class="card-title">${card.title}</div>
        <div class="card-subtitle">${card.subtitle}</div>
      </div>
    </div>
    <div class="card-body">${card.content}</div>
  `;

  document.getElementById('counter').textContent = `Card ${current + 1} of ${total}`;
  document.getElementById('progressBar').style.width = `${((current + 1) / total) * 100}%`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;

  // Update dots
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === current);
  });

  // Scroll counter into view
  document.getElementById('counter').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function navigate(dir) {
  current = Math.max(0, Math.min(total - 1, current + dir));
  renderCard();
}

// Build dots
const dotsEl = document.getElementById('dots');
cards.forEach((_, i) => {
  const dot = document.createElement('button');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.setAttribute('aria-label', `Card ${i + 1}`);
  dot.onclick = () => { current = i; renderCard(); };
  dotsEl.appendChild(dot);
});

renderCard();
</script>
</body>
</html>
