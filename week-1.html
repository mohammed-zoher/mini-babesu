<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 1 — Your Baby Week by Week</title>
<style>
  :root {
    --cream: #FDF6EE;
    --card-bg: #FFFCF8;
    --warm-brown: #5C3D2E;
    --muted: #8C7060;
    --accent: #C4704A;
    --accent-light: #F0D9CC;
    --accent-pale: #FAF0EA;
    --border: #EAD9CC;
    --shadow: rgba(92,61,46,0.08);
    --green: #5A7A5A;
    --green-pale: #EBF2EB;
    --blue: #4A6A8A;
    --blue-pale: #E8F0F7;
    --gold: #A07A3A;
    --gold-pale: #F5EDD8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--warm-brown);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--warm-brown);
    background-image: radial-gradient(ellipse at 70% 50%, rgba(196,112,74,0.3) 0%, transparent 70%);
    padding: 48px 24px 40px;
    text-align: center;
    color: var(--cream);
  }
  .header .week-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-light);
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: normal;
    letter-spacing: -0.01em;
    color: #FDF6EE;
    margin-bottom: 8px;
  }
  .header .subtitle {
    font-style: italic;
    font-size: 15px;
    color: rgba(253,246,238,0.6);
  }

  /* NAV WRAPPER */
  .nav-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px 0;
  }
  .counter {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    scroll-margin-top: 20px;
  }
  .progress-bar-track {
    width: min(560px, 94%);
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.35s ease;
  }

  /* CARD */
  .card-wrapper {
    display: flex;
    justify-content: center;
    padding: 0 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 4px 24px var(--shadow);
    width: min(560px, 100%);
    overflow: hidden;
    animation: slideIn 0.3s ease forwards;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 24px 28px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .card-icon {
    font-size: 22px;
    background: var(--accent-pale);
    border: 1px solid var(--accent-light);
    border-radius: 12px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-title {
    font-size: 19px;
    font-weight: bold;
    color: var(--warm-brown);
    line-height: 1.2;
  }
  .card-subtitle {
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }
  .card-body {
    padding: 22px 28px 28px;
  }

  /* STAT PILLS */
  .stat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .stat-pill {
    background: var(--accent-pale);
    border: 1px solid var(--accent-light);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--warm-brown);
  }
  .stat-pill strong { color: var(--accent); }

  /* BULLET LIST */
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul li {
    padding: 10px 0 10px 20px;
    position: relative;
    font-size: 14px;
    line-height: 1.65;
    border-bottom: 1px solid var(--border);
    color: var(--warm-brown);
  }
  ul li:last-child { border-bottom: none; }
  ul li::before {
    content: '·';
    color: var(--accent);
    position: absolute;
    left: 4px;
    top: 9px;
    font-size: 20px;
    line-height: 1.3;
  }

  /* NUMBERED STEPS */
  ol.steps {
    list-style: none;
    counter-reset: steps;
    margin: 0; padding: 0;
  }
  ol.steps li {
    counter-increment: steps;
    padding: 10px 0 10px 42px;
    position: relative;
    font-size: 14px;
    line-height: 1.65;
    border-bottom: 1px solid var(--border);
  }
  ol.steps li:last-child { border-bottom: none; }
  ol.steps li::before {
    content: counter(steps);
    position: absolute;
    left: 0;
    top: 11px;
    background: var(--accent);
    color: white;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  /* INFO BOXES */
  .info-box {
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13.5px;
    line-height: 1.6;
    margin-top: 14px;
  }
  .info-box strong { display: block; margin-bottom: 4px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .info-box.warm  { background: var(--accent-pale); border: 1px solid var(--accent-light); color: var(--warm-brown); }
  .info-box.warm strong { color: var(--accent); }
  .info-box.green { background: var(--green-pale); border: 1px solid #BDD4BD; color: #3A5A3A; }
  .info-box.green strong { color: var(--green); }
  .info-box.blue  { background: var(--blue-pale);  border: 1px solid #BDD0E0; color: #2A4A6A; }
  .info-box.blue strong  { color: var(--blue); }
  .info-box.amber { background: var(--gold-pale);  border: 1px solid #D4B87A; color: #5A4010; }
  .info-box.amber strong { color: var(--gold); }

  /* DIFF ROW */
  .diff-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .diff-col {
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
  }
  .diff-col.left  { background: var(--blue-pale);  border: 1px solid #BDD0E0; color: #2A4A6A; }
  .diff-col.right { background: var(--gold-pale);  border: 1px solid #D4B87A; color: #5A4010; }
  .diff-col strong { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; }
  .diff-col.left strong  { color: var(--blue); }
  .diff-col.right strong { color: var(--gold); }

  /* GENDER GRID */
  .gender-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .gender-col {
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
  }
  .gender-col.boy  { background: #E8F0F7; border: 1px solid #BDD0E0; color: #2A4060; }
  .gender-col.girl { background: #FBF0F5; border: 1px solid #E0BDCF; color: #6A2A50; }
  .gender-col strong { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; }
  .gender-col.boy strong  { color: var(--blue); }
  .gender-col.girl strong { color: #C4608A; }

  /* LATCH CHECK */
  .latch-check {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .latch-ok, .latch-no {
    border-radius: 10px;
    padding: 14px 14px;
    font-size: 13px;
    line-height: 1.6;
  }
  .latch-ok { background: var(--green-pale); border: 1px solid #BDD4BD; color: #3A5A3A; }
  .latch-no { background: #FFF0F0; border: 1px solid #E0BDBD; color: #6A2A2A; }
  .latch-ok strong, .latch-no strong { display: block; margin-bottom: 4px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }

  /* SECTION LABEL */
  .section-label {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 18px 0 10px;
  }

  /* NAV BUTTONS */
  .nav-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 24px 24px 16px;
  }
  .btn {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 14px;
    padding: 10px 28px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 2px solid var(--accent);
  }
  .btn-outline {
    background: transparent;
    color: var(--accent);
  }
  .btn-outline:hover:not(:disabled) {
    background: var(--accent);
    color: white;
    transform: translateY(-1px);
  }
  .btn-solid {
    background: var(--accent);
    color: white;
  }
  .btn-solid:hover:not(:disabled) {
    background: #A85A38;
    transform: translateY(-1px);
  }
  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }

  /* DOTS */
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding-bottom: 40px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
    padding: 0;
  }
  .dot.active {
    background: var(--accent);
    width: 10px;
    height: 10px;
  }
  .dot:hover { background: var(--accent-light); }

  /* FOOTER */
  footer {
    text-align: center;
    font-style: italic;
    font-size: 11px;
    color: var(--muted);
    padding: 0 24px 36px;
  }

  /* RESPONSIVE */
  @media (max-width: 500px) {
    .diff-row, .latch-check, .gender-grid { grid-template-columns: 1fr; }
    .btn { padding: 9px 20px; font-size: 13px; }
    .card-header { padding: 18px 18px 14px; }
    .card-body { padding: 16px 18px 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="week-label">Week 1</div>
  <h1>Finding Your Feet</h1>
  <p class="subtitle">Nappies, first baths, feeding, and sleep</p>
</div>

<div class="nav-wrapper">
  <div class="counter" id="counter">Card 1 of 7</div>
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progressBar" style="width: 14.28%"></div>
  </div>
</div>

<div class="card-wrapper">
  <div class="card" id="card"></div>
</div>

<div class="nav-buttons">
  <button class="btn btn-outline" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
  <button class="btn btn-solid"   id="nextBtn" onclick="navigate(1)">Next →</button>
</div>

<div class="dots" id="dots"></div>

<footer><em>Source: Your Baby Week by Week</em> — all content sourced directly from the book</footer>

<script>
const cards = [
  {
    icon: '🩹',
    title: 'Nappies',
    subtitle: 'Over 100 changes by the end of this week',
    render: () => `
      <div class="stat-row">
        <div class="stat-pill">Wet nappies / 24h: <strong>8–12</strong></div>
        <div class="stat-pill">Dirty nappies / 24h: <strong>0–12</strong></div>
      </div>
      <div class="section-label">What's normal this week</div>
      <ul>
        <li>His kidneys are still immature — he produces <strong>high volumes of dilute urine</strong>; his immature bowels mean he may go after every feed, or just once every other day — both patterns are normal</li>
        <li><strong>Best tip:</strong> keep a roll of kitchen paper next to the changing table — he's extremely likely to wee or poo mid-change</li>
        <li>You don't have to change his nappy at every night feed if he's feeding more than every three hours, has only done a very small poo, and hasn't got nappy rash</li>
      </ul>
      <div class="gender-grid">
        <div class="gender-col boy"><strong>👦 Boys</strong>Tuck his penis downwards in the nappy to avoid him weeing out of the top and over his clothes</div>
        <div class="gender-col girl"><strong>👧 Girls</strong>A white vaginal discharge — possibly bloodstained — in the first few weeks is normal; simply caused by mum's hormones</div>
      </div>
      <div class="section-label">Nappy bag — what to pack</div>
      <ul>
        <li>One nappy for every hour you intend to be out</li>
        <li>Baby wipes (more convenient than cotton wool when out; fragranced ones can smell overwhelming)</li>
        <li>Something to dry his bottom — a clean face cloth works well</li>
        <li>Nappy bags, a change of clothes (+ plastic bag), a changing mat, bibs and muslin squares</li>
        <li><strong>If breastfeeding:</strong> breast pads and nipple cream</li>
        <li><strong>If bottle-feeding:</strong> at least one disposable bottle and a carton of ready-to-feed milk</li>
      </ul>
    `
  },
  {
    icon: '🛁',
    title: 'First Bath',
    subtitle: 'This week you can start bathing every few days',
    render: () => `
      <div class="info-box blue">
        <strong>The aim</strong>
        The first bath isn't about getting super clean — it's simply to get your baby used to being in water and to give you a bit of practice. You should feel confident and relaxed after about half a dozen times.
      </div>
      <div class="section-label">Equipment &amp; setup</div>
      <ul>
        <li>Use a baby bath, or the big bath with a <strong>rubber mat</strong>, bath seat, or deckchair-shaped bath support</li>
        <li>Keep the bath <strong>shallow — just 5–8 cm / 2–3 in deep</strong></li>
        <li>Test water temperature with your wrist or elbow (more sensitive than hands); ideal temp is around <strong>37°C / 98.6°F</strong></li>
        <li><strong>Always put cold water in first</strong> to avoid scalding — most burns in young children happen when parents forget this step</li>
        <li>Don't make it too cold either — your baby won't like a tepid bath</li>
      </ul>
      <div class="section-label">Technique</div>
      <ol class="steps">
        <li>Undress him down to his nappy and wrap him in a towel; make final temperature adjustments</li>
        <li>Remove his nappy; clean any poo while keeping his top half covered with the towel</li>
        <li>Lower him slowly, <strong>semi-upright</strong> — one hand around shoulders and under his armpit supporting his head, the other under his bottom</li>
        <li>Wash with a face cloth and water only — <strong>no soap or shampoo</strong> for the first bath; gently rub face, hair, chin, armpits, hands, then bottom</li>
        <li>Keep the bath short — take him out after a couple of minutes before he gets cold; have a towel ready on the floor</li>
      </ol>
      <div class="section-label">If your baby hates his bath</div>
      <ul>
        <li>After about <strong>six baths</strong> he'll probably begin to enjoy it</li>
        <li>Check he's not cold — keep the bathroom warm and verify water temperature</li>
        <li>Try wrapping him in a <strong>muslin cloth</strong> in the water — helps him feel secure</li>
        <li>Avoid bathing when he's tired or hungry — aim for about <strong>half an hour after a feed</strong>, when he's more alert (morning works well)</li>
        <li>Stay relaxed — your baby may pick up on your stress; keep soothing and smiling at him</li>
        <li>Keep bathtime very short — <strong>20 seconds</strong> in the water is enough if he gets very distressed</li>
      </ul>
    `
  },
  {
    icon: '🍼',
    title: 'Feeding Requirements',
    subtitle: 'How much milk your baby needs this week',
    render: () => `
      <div class="stat-row">
        <div class="stat-pill">Daily total: <strong>540–690 ml / 19–24 oz</strong></div>
        <div class="stat-pill">Per feed: <strong>up to 90 ml / 3 oz</strong></div>
        <div class="stat-pill">Feeds per day: <strong>up to 12</strong></div>
        <div class="stat-pill">Pattern: <strong>irregular</strong></div>
      </div>
      <div class="section-label">This week's approach</div>
      <ul>
        <li>Your baby is very new to feeding — he may still seem confused and may <strong>forget what to do</strong> from one feed to the next; keep practising and don't expect too much</li>
        <li>Continue <strong>demand-feeding</strong> — sometimes he may go four hours between feeds, other times he'll want a top-up after just an hour</li>
      </ul>
      <div class="section-label">Bottle-feeding this week</div>
      <ul>
        <li>He should be much better at feeding from a bottle — taking <strong>60–90 ml / 2–3 oz per feed</strong></li>
        <li>It's still too early for a feeding routine — continue to follow his demands; be prepared to throw away un-drunk milk</li>
      </ul>
      <div class="info-box warm">
        <strong>Fore milk &amp; hind milk</strong>
        If your baby slows his pace and sucks sporadically towards the end of a breastfeed, he's moved from the 'fore' milk (thirst-quenching) to the 'hind' milk (richer and more filling). Don't rush to end the feed or switch breasts when he seems to slow down.
      </div>
      <div class="section-label">Sterilising bottles</div>
      <ul>
        <li><strong>Boiling:</strong> submerge in a large saucepan for at least 10 minutes; no trapped air bubbles; set a timer; keep the lid on until ready to use; check teats regularly for tears or cracks</li>
        <li><strong>Electric steamer:</strong> arrange washed bottles, add water, switch on; some models take just 5 minutes; up to 6 bottles at a time</li>
        <li><strong>Microwave steamer:</strong> add water, microwave up to 8 minutes; cheaper and smaller than electric; up to 4 bottles at a time</li>
      </ul>
    `
  },
  {
    icon: '🤱',
    title: 'Breastfeeding Challenges',
    subtitle: 'Sore nipples and milk supply — what to do',
    render: () => `
      <div class="section-label">Sore &amp; cracked nipples</div>
      <ul>
        <li>Cracked, blistered and bleeding nipples are <strong>extremely common</strong> in the early stages</li>
        <li>The most likely cause is <strong>poor latch</strong> — ensure his lips cover your areola (the darker area around the nipple) and his mouth is open wide</li>
        <li>If it feels uncomfortable, stop immediately — you can get a blister after just <strong>15 minutes</strong>; to stop him mid-feed, slide your finger into his mouth to break the suction</li>
        <li>You need to keep breastfeeding through the pain — otherwise your milk will dry up; in desperate cases you can give expressed milk for a couple of days, but get back to direct suckling as soon as possible</li>
        <li>Breastfeeding does actually <strong>'toughen up'</strong> your nipples as well as elongate flatter ones</li>
      </ul>
      <div class="info-box warm">
        <strong>Pain relief options</strong>
        Nipple cream such as Lansinoh HPA Lanolin (approved by Allergy UK, no need to remove before feeding); a smear of Vaseline; paracetamol with codeine 15 minutes before a feed (won't harm baby, but be aware codeine can cause constipation); ibuprofen if suitable for you.
      </div>
      <div class="info-box amber">
        <strong>Nipple shields — last resort</strong>
        Instantly less painful, but shields have been shown to reduce milk production and your baby may become used to them and struggle to feed directly. If you use them, limit to every other feed if possible, or just on the more painful nipple.
      </div>
      <div class="section-label">Insufficient milk</div>
      <ul>
        <li>If your baby is <strong>gaining weight</strong> and has plenty of wet and dirty nappies, you have enough milk — no need to measure by expressing</li>
        <li>If you can't express more than <strong>half an ounce from both breasts within 10 minutes</strong>, you may be short of milk</li>
      </ul>
      <div class="section-label">How to boost milk supply</div>
      <ul>
        <li><strong>Express after every daytime feed</strong> for a week — you'll quickly produce more; you can freeze the milk initially</li>
        <li>Feed on demand, let him take as long as he wants, and <strong>offer both breasts</strong> — more stimulation = more milk</li>
        <li>Drink at least <strong>3 litres of water a day</strong>; keep a jug in your bedroom and drink throughout the night</li>
        <li><strong>Don't smoke</strong> — this reduces milk production and affects your let-down reflex</li>
        <li>Avoiding stress, eating regularly, and having warm baths are also thought to help</li>
      </ul>
    `
  },
  {
    icon: '😴',
    title: 'Sleep & Day/Night Rhythms',
    subtitle: 'Helping your baby tell day from night',
    render: () => `
      <div class="info-box blue">
        <strong>This week</strong>
        Your baby's internal body clock hasn't yet been set — he may have bowel movements throughout the night and won't yet sleep longer at night. Towards the end of the week you'll notice he sleeps for slightly longer before waking for a feed.
      </div>
      <div class="diff-row">
        <div class="diff-col left">
          <strong>🌙 Night — keep it boring</strong>
          Low lights (just a bedside light); don't talk; avoid eye contact. Your baby will be comforted by your smell and touch.
        </div>
        <div class="diff-col right">
          <strong>☀️ Day — keep it stimulating</strong>
          Don't let him sleep for longer than <strong>3 hours</strong> at a time; open the curtains; feel free to use the TV, washing machine, and phone.
        </div>
      </div>
      <div class="section-label">Waking your baby gently</div>
      <ul>
        <li>Rock him and talk to him, or change his nappy to rouse him — it's important he feeds regularly during the day</li>
        <li>It's useful if he learns to sleep through ambient noise — when he's older, you won't have to tiptoe around</li>
      </ul>
      <div class="info-box warm">
        <strong>Helpful resource</strong>
        There's a video on rousing and soothing your baby on the Baby Buddy app.
      </div>
      <div class="section-label">Excessive crying</div>
      <ul>
        <li>A perfectly healthy baby can cry for up to <strong>12 hours</strong> non-stop — his number one request is still for food, so always try milk first</li>
        <li>If feeding, burping, rocking, and nappy changing don't work, see your <strong>GP or midwife</strong> — they can eliminate any medical problems; knowing your baby is okay can itself reduce crying</li>
        <li>Relatives and friends with baby experience are invaluable — don't feel bad if your baby stops crying the instant someone else takes him</li>
      </ul>
    `
  },
  {
    icon: '🩺',
    title: 'SIDS & Safe Sleeping',
    subtitle: 'What you need to know about cot death',
    render: () => `
      <div class="info-box amber">
        <strong>⚠️ Safety tip of the week</strong>
        Always put your baby to sleep on his <strong>back</strong>, day and night. This has been shown to significantly reduce the risk of SIDS. Make sure babysitters and grandparents do the same — older people are more likely to wrongly think it's okay to put a baby to sleep on his front.
      </div>
      <div class="section-label">The facts about SIDS</div>
      <ul>
        <li>SIDS (formerly called cot death) is now <strong>rare</strong> — it affects fewer than 200 babies in the UK every year</li>
        <li>It <strong>peaks at two and three months</strong>, then drops off quickly; it hardly ever occurs after six months</li>
        <li>SIDS usually happens when a baby is asleep; the cause is not known</li>
        <li>It may be related to a problem with how well a baby's body responds to stress and controls <strong>breathing, temperature, and heart rate</strong></li>
      </ul>
      <div class="section-label">Who may be more at risk</div>
      <ul>
        <li>Babies born <strong>prematurely</strong> or with a <strong>low birth weight</strong> may be more prone</li>
      </ul>
      <div class="info-box green">
        <strong>Reassurance</strong>
        Feeling exhausted can make the anxiety worse. But SIDS is now rare — fewer than 200 cases a year in the UK. Back sleeping is the single most important thing you can do to reduce the risk.
      </div>
    `
  },
  {
    icon: '🌱',
    title: 'Development',
    subtitle: 'What your baby can do this week',
    render: () => `
      <ul>
        <li>Your baby will start to <strong>recognise your face</strong> — studies show that parents' faces trigger feelings of pleasure and calm in babies</li>
        <li>He'll stare at your face but won't be very good at <strong>making eye contact</strong> at this stage</li>
        <li>He <strong>can't control his head yet</strong> — when lying down, it rests to one side; always support his head when holding him</li>
        <li>When he's in your arms, you may notice <strong>tiny head movements</strong> as he tries to watch your face — even this small effort strengthens his muscles</li>
      </ul>
      <div class="info-box warm">
        <strong>What you can do</strong>
        Spend time holding him and letting him look at your face — this is the most stimulating thing for him right now.
      </div>
      <div class="info-box warm" style="text-align:center; font-style:italic; font-size:15px; margin-top: 18px;">
        You made it through Week 1 🎉
      </div>
    `
  }
];

let current = 0;

function render() {
  const total = cards.length;
  const card = cards[current];

  document.getElementById('counter').textContent = `Card ${current + 1} of ${total}`;
  document.getElementById('progressBar').style.width = `${((current + 1) / total) * 100}%`;

  const cardEl = document.getElementById('card');
  cardEl.style.animation = 'none';
  cardEl.offsetHeight;
  cardEl.style.animation = '';
  cardEl.innerHTML = `
    <div class="card-header">
      <div class="card-icon">${card.icon}</div>
      <div>
        <div class="card-title">${card.title}</div>
        <div class="card-subtitle">${card.subtitle}</div>
      </div>
    </div>
    <div class="card-body">${card.render()}</div>
  `;

  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;

  document.querySelectorAll('.dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === current);
  });

  document.getElementById('counter').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function navigate(dir) {
  current = Math.max(0, Math.min(cards.length - 1, current + dir));
  render();
}

// Build dots
const dotsEl = document.getElementById('dots');
cards.forEach((_, i) => {
  const dot = document.createElement('button');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.setAttribute('aria-label', `Go to card ${i + 1}`);
  dot.onclick = () => { current = i; render(); };
  dotsEl.appendChild(dot);
});

render();
</script>
</body>
</html>
