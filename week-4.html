<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 — Peek-a-Week 🍼</title>
<style>
  :root {
    --cream: #FDF6EE;
    --card-bg: #FFFCF8;
    --warm-brown: #5C3D2E;
    --muted: #8C7060;
    --accent: #C4704A;
    --accent-light: #F0D9CC;
    --accent-pale: #FAF0EA;
    --border: #EAD9CC;
    --shadow: rgba(92,61,46,0.08);
    --green: #5A7A5A;
    --green-pale: #EBF2EB;
    --blue: #4A6A8A;
    --blue-pale: #E8F0F7;
    --gold: #A07A3A;
    --gold-pale: #F5EDD8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--warm-brown);
    min-height: 100vh;
  }

  .header {
    background: var(--warm-brown);
    background-image: radial-gradient(ellipse at 70% 50%, rgba(196,112,74,0.3) 0%, transparent 70%);
    padding: 52px 24px 44px;
    text-align: center;
    color: var(--cream);
  }
  .header .week-label {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent-light); margin-bottom: 12px;
  }
  .header h1 {
    font-size: clamp(26px, 5vw, 40px); font-weight: normal;
    letter-spacing: -0.01em; color: #FDF6EE; margin-bottom: 10px;
  }
  .header .subtitle {
    font-style: italic; font-size: 15px;
    color: rgba(253,246,238,0.6); max-width: 400px; margin: 0 auto;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent-light); text-decoration: none; padding: 14px 24px 0;
  }
  .back-link:hover { color: white; }

  .counter {
    text-align: center; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent); padding: 28px 24px 10px;
    scroll-margin-top: 16px;
  }
  .progress-wrap {
    max-width: min(560px, 94%); margin: 0 auto 24px;
    height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s ease;
  }

  .card-wrap { display: flex; justify-content: center; padding: 0 24px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 18px; box-shadow: 0 4px 28px var(--shadow);
    width: min(560px, 100%); overflow: hidden; animation: slideIn 0.3s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 26px 28px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 16px;
  }
  .card-icon {
    font-size: 22px; background: var(--accent-pale); border-radius: 12px;
    padding: 10px 12px; line-height: 1; flex-shrink: 0;
  }
  .card-title { font-size: 19px; font-weight: bold; color: var(--warm-brown); margin-bottom: 3px; line-height: 1.2; }
  .card-subtitle { font-style: italic; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .card-body { padding: 24px 28px 28px; }

  .stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .stat-pill {
    background: var(--accent-pale); border: 1px solid var(--accent-light);
    border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--warm-brown);
  }
  .stat-pill strong { color: var(--accent); }

  ul { list-style: none; padding: 0; }
  ul li {
    padding: 10px 0 10px 20px; position: relative;
    font-size: 14px; line-height: 1.65; border-bottom: 1px solid var(--border);
    color: var(--warm-brown);
  }
  ul li:last-child { border-bottom: none; }
  ul li::before {
    content: '·'; position: absolute; left: 4px;
    color: var(--accent); font-size: 18px; line-height: 1.4;
  }

  ol.steps { list-style: none; padding: 0; counter-reset: steps; }
  ol.steps li {
    padding: 10px 0 10px 42px; position: relative; font-size: 14px;
    line-height: 1.65; border-bottom: 1px solid var(--border); counter-increment: steps;
  }
  ol.steps li:last-child { border-bottom: none; }
  ol.steps li::before {
    content: counter(steps); position: absolute; left: 0; top: 10px;
    width: 26px; height: 26px; background: var(--accent); color: white;
    border-radius: 50%; font-size: 12px; display: flex;
    align-items: center; justify-content: center; font-family: Georgia, serif;
  }

  .info-box { border-radius: 10px; padding: 14px 16px; font-size: 13.5px; line-height: 1.6; margin-top: 14px; }
  .info-box strong { display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  .info-box.warm  { background: var(--accent-pale); border: 1px solid var(--accent-light); color: var(--warm-brown); }
  .info-box.warm strong { color: var(--accent); }
  .info-box.green { background: var(--green-pale); border: 1px solid #C2D9C2; color: #2E4A2E; }
  .info-box.green strong { color: var(--green); }
  .info-box.blue  { background: var(--blue-pale); border: 1px solid #C0D0DF; color: #1E3045; }
  .info-box.blue strong { color: var(--blue); }
  .info-box.amber { background: var(--gold-pale); border: 1px solid #DEC89A; color: #4A3010; }
  .info-box.amber strong { color: var(--gold); }

  .section-label {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin: 18px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }

  .diff-row { display: flex; gap: 10px; margin-top: 14px; }
  .diff-col { flex: 1; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.55; }
  .diff-col.left  { background: var(--blue-pale); border: 1px solid #C0D0DF; color: #1E3045; }
  .diff-col.right { background: var(--gold-pale); border: 1px solid #DEC89A; color: #4A3010; }
  .diff-col strong { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
  .diff-col.left strong { color: var(--blue); }
  .diff-col.right strong { color: var(--gold); }

  .nav {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; padding: 24px 24px 10px;
  }
  .btn {
    font-family: Georgia, serif; font-size: 14px; padding: 10px 28px;
    border-radius: 24px; cursor: pointer; transition: all 0.18s ease; border: 1.5px solid var(--accent);
  }
  .btn-prev { background: transparent; color: var(--accent); }
  .btn-prev:hover:not(:disabled) { background: var(--accent); color: white; transform: translateY(-1px); }
  .btn-next { background: var(--accent); color: white; }
  .btn-next:hover:not(:disabled) { background: #A85A38; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.3; cursor: default; transform: none; }

  .dots { display: flex; justify-content: center; gap: 7px; padding: 12px 24px 32px; flex-wrap: wrap; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--border);
    cursor: pointer; transition: all 0.2s ease; border: none; padding: 0;
  }
  .dot.active { background: var(--accent); transform: scale(1.3); }

  footer {
    text-align: center; font-style: italic; font-size: 11px;
    color: var(--muted); padding: 0 24px 36px;
  }

  @media (max-width: 500px) {
    .card-header { padding: 20px 18px 16px; }
    .card-body { padding: 18px 18px 22px; }
    .btn { padding: 9px 20px; font-size: 13px; }
    .diff-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">← All weeks</a>
  <div class="week-label">Week 4</div>
  <h1>Finding a Rhythm</h1>
  <p class="subtitle">Feeding efficiency, dummies, bedtime routines & development</p>
</div>

<div class="counter" id="counter">Card 1 of 7</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:14.28%"></div></div>

<div class="card-wrap"><div class="card" id="card"></div></div>

<div class="nav">
  <button class="btn btn-prev" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
  <button class="btn btn-next" id="nextBtn" onclick="navigate(1)">Next →</button>
</div>
<div class="dots" id="dots"></div>

<footer><em>Source: Your Baby Week by Week</em> — all content sourced directly from the book</footer>

<script>
const cards = [
  {
    icon: '🍼',
    title: 'Feeding & Burping',
    subtitle: 'Faster feeds, more wind — and three ways to burp',
    content: `
      <div class="stat-row">
        <div class="stat-pill">Daily total: <strong>660–840 ml / 23–29 oz</strong></div>
        <div class="stat-pill">Per feed: <strong>up to 120 ml / 4 oz</strong></div>
        <div class="stat-pill">Feeds per day: <strong>7–10</strong></div>
      </div>
      <ul>
        <li>By now your baby can drink faster — feeds are more likely to last 40 minutes than an entire hour.</li>
        <li>The upside of more efficient feeding is that your baby goes longer between feeds, perhaps up to four hours on occasion.</li>
        <li>More rapid drinking may mean he gulps more air, so he'll need lots of burping. Small quantities of air swallowed form tiny bubbles that eventually make one large bubble — that's why babies are often windier at the end of the day.</li>
        <li>Allow five minutes for air to come up during a feed, or longer if your baby shows signs of discomfort. It can take up to 40 minutes for air to come up after the feed is finished. Keep a muslin handy — babies often bring up a bit of milk when they burp.</li>
      </ul>
      <div class="section-label">Three ways to burp your baby</div>
      <ol class="steps">
        <li><strong>Sitting on your knee:</strong> sit your baby on your knee with his chin resting on your finger and thumb, then gently rub his back with your other hand. You can try tilting him forward slightly to help expel air — but stop if he protests.</li>
        <li><strong>Upright on your chest:</strong> hold your baby upright against your chest with his head resting on your shoulder. His stomach presses gently against your chest, which can encourage air to come up. Rub his back.</li>
        <li><strong>Face down on your lap:</strong> lay your baby on your lap, tummy downwards, and rub his back. Alternating this position with the more upright postures seems to encourage wind to come up.</li>
      </ol>
    `
  },
  {
    icon: '🤱',
    title: 'Breastfeeding',
    subtitle: 'Mastitis, favourite breast & medicines',
    content: `
      <div class="info-box green">
        <strong>Good news</strong>
        By now breastfeeding may be well established — you don't have to fiddle around warming bottles at night, and any painful let-down from the early days will have subsided.
      </div>
      <div class="info-box amber">
        <strong>Medicines reminder</strong>
        If you're breastfeeding, always check with your pharmacist, health visitor or GP before taking any medicines.
      </div>
      <div class="section-label">Mastitis</div>
      <ul>
        <li>Mastitis (an infected milk duct) is quite common around now, possibly because your milk production has increased.</li>
        <li>It begins as a blocked milk duct — treat this as soon as you become aware of it. Hot baths, hot flannels, massage and plenty of sucking by your baby should unblock the duct.</li>
        <li>If the duct becomes infected you'll need antibiotics, though you can continue to feed throughout treatment.</li>
        <li>If a blocked duct shows no improvement after 24 hours, see your doctor.</li>
      </ul>
      <div class="section-label">Favourite breast</div>
      <ul>
        <li>Around now your baby may start to favour one breast — usually because you find it easier to feed on one side and naturally offer that breast more often.</li>
        <li>Milk production then increases on that side, which reinforces the preference — lots of mums end up lopsided throughout breastfeeding.</li>
        <li>Break the cycle now: offer your baby the non-favoured breast first at every feed, and also pump from it to increase milk production. It should only take a couple of days to even things out.</li>
      </ul>
    `
  },
  {
    icon: '🩹',
    title: 'Bottle-feeding & Nappies',
    subtitle: 'Get the formula right — and enjoy fewer nappy changes',
    content: `
      <div class="section-label">Bottle-feeding</div>
      <ul>
        <li>You may be fast and efficient at making up feeds by now — but don't be too hasty when measuring out scoops of powder and water.</li>
        <li>It's essential you use the exact measurements: if the formula is too concentrated it can put a strain on your baby's immature kidneys and gut. Always follow the directions to the letter.</li>
        <li>Never be tempted to 'keep your baby going a little longer' by adding extra milk powder to his feed.</li>
        <li>If your baby gets diarrhoea, your GP may tell you to make up the formula more dilute than usual to help prevent dehydration — but only do this on medical advice, and not for more than a few days, as your baby won't be getting adequate calories.</li>
      </ul>
      <div class="section-label">Nappies</div>
      <div class="stat-row">
        <div class="stat-pill">Wet nappies: <strong>4–8 per day</strong></div>
        <div class="stat-pill">Dirty nappies: <strong>0–8 per day</strong></div>
      </div>
      <ul>
        <li>At last you should see an improvement — your baby will be weeing less as his kidneys are now more developed.</li>
        <li>If he's been doing one poo per feed until now, this should stop by the end of the week as his bowel movements become less frequent.</li>
        <li>You should see an end to changing nappies throughout the night — urine alone won't cause nappy rash, so no need to worry if his nappy is a bit wet at night.</li>
      </ul>
    `
  },
  {
    icon: '😴',
    title: 'Sleep',
    subtitle: 'Still awake in the evenings — but a bedtime is coming',
    content: `
      <div class="stat-row">
        <div class="stat-pill">Sleep needed: <strong>14–17 hours/day</strong></div>
        <div class="stat-pill">Pattern: <strong>awake in the evenings</strong></div>
      </div>
      <ul>
        <li>It's unlikely your baby will be showing any sign of establishing a sleep pattern yet, apart from being wide awake every evening.</li>
        <li>He'll probably stay alert until 11 pm or even later. If you try to put him to bed at 7 pm, you'll end up running in and out of his room all evening.</li>
        <li>It's less stressful to go with your baby's sleep pattern for now. Move his Moses basket into a quiet, dimly lit corner of your living room. Don't feel guilty — just enjoy cuddling him, because in a couple of months he'll be tucked up in his cot in the evenings.</li>
      </ul>
      <div class="section-label">Sleep-training tip — spotting a bedtime</div>
      <div class="info-box warm">
        <strong>How to find your baby's bedtime</strong>
        Observe what time your baby finally gets sleepy at night — a 10-minute doze doesn't count. You're looking for a deep, milk-satisfied sleep. If this happens at a similar time for three consecutive nights, you have a 'bedtime'. Begin a bedtime routine about 30 minutes earlier: a bath, perhaps a massage, then a night feed with lights low and voice soft. He should get the message after a few nights.
      </div>
      <div class="info-box green">
        <strong>If your baby has colic</strong>
        You'll probably have to wait a few more weeks before you can find his bedtime — but you WILL get your evenings back.
      </div>
    `
  },
  {
    icon: '💛',
    title: 'Crying & Dummies',
    subtitle: 'Peak crying weeks — and the dummy decision',
    content: `
      <div class="stat-row">
        <div class="stat-pill">Expected crying: <strong>1–6 hours/day</strong></div>
      </div>
      <ul>
        <li>It's normal for a baby to cry more than ever right now. Expect these bouts of prolonged, intense, unexplained crying to carry on for another few weeks before you see any improvement.</li>
        <li>If your baby has been reasonably placid until now and crying seems sudden, it could be that he's ill. Check his temperature — above 38°C/100.4°F indicates a fever. Call your GP if you're worried.</li>
        <li>Breastfed babies shouldn't have a dummy much earlier than this week as it can confuse their latching-on technique and upset the balance between milk demand and supply. Bottle-fed babies can have one from around week two, as long as feeding and weight gain are satisfactory.</li>
        <li>Try to only use a dummy for the first 12 weeks — after this, habits become harder to break.</li>
      </ul>
      <div class="section-label">Dummy pros & cons</div>
      <div class="diff-row">
        <div class="diff-col left">
          <strong>Pros</strong>
          A quick way to pacify a screaming baby — breathing becomes calmer as he sucks. May reduce SIDS risk when going to sleep (don't replace it once he's asleep). Can be thrown away — harder to stop thumb sucking. May produce more saliva to fight plaque.
        </div>
        <div class="diff-col right">
          <strong>Cons</strong>
          May lead to crooked teeth or an open bite. Can mask hunger — don't use if weight gain is poor. Increases risk of ear infections and diarrhoea. Can affect speech development — babies don't babble with a dummy in.
        </div>
      </div>
      <div class="section-label">Avoiding the pitfalls</div>
      <ul>
        <li>Use a dummy only when your baby needs to calm down for sleep — remove it just before he falls asleep.</li>
        <li>Use an orthodontic dummy — adapts to your baby's mouth and is less likely to affect teeth development.</li>
        <li>Keep dummies sterilised. Replace any that have split. Avoid attached ribbons or strings — these could catch around his throat.</li>
        <li>Make sure your baby is being fed enough and hunger isn't being masked by sucking.</li>
      </ul>
    `
  },
  {
    icon: '🛁',
    title: 'Bathing Together & Scalds',
    subtitle: 'A bonding bath — and how to keep it safe',
    content: `
      <div class="section-label">Bathing with your baby</div>
      <ul>
        <li>Now your baby doesn't seem quite so fragile, you could try bathing with him. This is a wonderful bonding experience — your baby lies on your chest as you gently slosh water over him.</li>
        <li>Have the water a little cooler than you'd normally run for yourself — the temperature should suit your baby, not you.</li>
        <li>For the first couple of times, have your partner around to pass your baby to you, or to take him out of the bath to be dried while you top it up with hot water. Use a bath mat to avoid slipping.</li>
        <li>After the bath, wear a towelling robe — you won't have time to dry yourself until you've dried and dressed your baby.</li>
        <li>Babies may wee in the water, but urine is sterile so this isn't a problem. Thankfully babies rarely, if ever, poo in the bath.</li>
      </ul>
      <div class="section-label">⚠ Bath scald safety</div>
      <ul>
        <li>Always put the <strong>cold water in before the hot</strong> to avoid accidentally scalding your baby.</li>
        <li>Even if you use a bath thermometer, still check the water with your wrist or elbow first. Ideal temperature: <strong>37°C / 98.6°F</strong> (body temperature).</li>
        <li>Babies have thinner skin than adults and can't jump away from heat — a bathwater scald can be serious.</li>
        <li>If your baby is scalded, cool with <strong>cool or lukewarm running water for 20–30 minutes</strong>. Do not use ice, iced water, or creams/butter. See your health visitor or GP for all scalds. If redness persists after a couple of hours or your baby seems in pain, go to A&amp;E.</li>
      </ul>
      <div class="info-box amber">
        <strong>⚠ Hot drink warning</strong>
        Don't drink tea or coffee while holding your baby — drinks can still scald 15 minutes after the kettle has boiled, and your baby is becoming more wriggly every day. If you spill a hot drink on your baby, remove wet clothes immediately, then treat as above. If the burn is larger than your baby's hand, take him to hospital — he may need intravenous fluids and pain relief.
      </div>
    `
  },
  {
    icon: '🌱',
    title: 'Development & Play',
    subtitle: 'First tears, stepping reflex, tummy time & vowel sounds',
    content: `
      <ul>
        <li><strong>First real tears:</strong> this week your baby will start crying actual tears — until now he has cried with dry eyes. The glands over his eyeballs now produce enough fluid for tears to flow.</li>
        <li><strong>Vigorous kicking:</strong> he's learning to use his large muscles — the same muscles that will eventually enable him to walk.</li>
        <li><strong>Stepping reflex:</strong> hold him upright under his arms near a table, then move him so the table top strokes the top of one foot — this triggers the step reflex. Quickly hold him 'standing' on the table and watch his feet take a few steps.</li>
        <li><strong>Head control:</strong> he still needs to rest his head on your shoulder a lot, but he'll be able to hold his head up for a few moments. Babies develop muscles from the neck downwards — control will progress down his body over the coming weeks.</li>
        <li><strong>Vowel sounds:</strong> he can now make clear vowel sounds such as 'eeh' and 'aah'. Copy him and he'll respond — one of the functions of all the recent crying was to give him practice at making these sounds.</li>
      </ul>
      <div class="section-label">Tummy time</div>
      <ul>
        <li>Put your baby on his front to play — use a playmat or blanket on the floor (never a raised surface). Keep him away from draughts.</li>
        <li>He may briefly lift his head, which develops his back and shoulder muscles. He'll probably only be happy on his front for a few minutes — persevere, because after week six he'll often refuse to go on his tummy at all.</li>
        <li>Tummy time is important: lying on his back doesn't have the same muscle-strengthening benefits, and babies now roll over and crawl later as they sleep on their backs.</li>
        <li>Putting him on his front also reduces the chance of flattened head syndrome — more common now babies routinely sleep on their backs (though harmless).</li>
        <li>If your baby gets distressed, feed and change him first, then lie on the floor next to him so he can see you. Wave a rattle in front of him, and talk and sing to encourage him to move his head.</li>
      </ul>
      <div class="info-box amber">
        <strong>⚠ When to see a doctor — pyloric stenosis</strong>
        A rare but serious condition where the outlet to your baby's stomach becomes blocked. Signs: vomiting nearly an entire meal after almost every feed (sometimes projected up to a metre), extreme hunger after vomiting, infrequent bowel movements, no weight gain, and your baby starting to look very thin. Seek medical advice if you notice these signs.
      </div>
      <div class="info-box warm" style="text-align:center;font-style:italic;font-size:14px;margin-top:16px;">
        You made it through Week 4 🎉
      </div>
    `
  }
];

let current = 0;
const total = cards.length;

function renderCard() {
  const card = cards[current];
  const el = document.getElementById('card');
  el.style.animation = 'none'; el.offsetHeight; el.style.animation = '';
  el.innerHTML = `
    <div class="card-header">
      <div class="card-icon">${card.icon}</div>
      <div class="card-header-text">
        <div class="card-title">${card.title}</div>
        <div class="card-subtitle">${card.subtitle}</div>
      </div>
    </div>
    <div class="card-body">${card.content}</div>
  `;
  document.getElementById('counter').textContent = `Card ${current + 1} of ${total}`;
  document.getElementById('progressBar').style.width = `${((current + 1) / total) * 100}%`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  document.getElementById('counter').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function navigate(dir) {
  current = Math.max(0, Math.min(total - 1, current + dir));
  renderCard();
}

const dotsEl = document.getElementById('dots');
cards.forEach((_, i) => {
  const dot = document.createElement('button');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.setAttribute('aria-label', `Card ${i + 1}`);
  dot.onclick = () => { current = i; renderCard(); };
  dotsEl.appendChild(dot);
});

renderCard();
</script>
</body>
</html>
